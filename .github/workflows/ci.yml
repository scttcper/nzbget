name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: start fixture server
        run: |
          python3 -m http.server 8768 --directory test >/tmp/nzbget-fixture.log 2>&1 &

      - name: start nzbget
        run: |
          docker run -d \
            --name nzbget \
            -p 6789:6789 \
            -e NZBGET_USER=nzbget \
            -e NZBGET_PASS=tegbzn6789 \
            lscr.io/linuxserver/nzbget:latest

      - name: wait for nzbget
        run: |
          for i in {1..30}; do
            if curl -fsS \
              -u 'nzbget:tegbzn6789' \
              -H 'Content-Type: application/json' \
              -d '{"version":"1.1","method":"version","params":[],"id":1}' \
              http://127.0.0.1:6789/jsonrpc >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: lint
        run: pnpm run lint

      - name: test
        env:
          TEST_NZBGET_URL: http://127.0.0.1:6789/
          TEST_NZBGET_USERNAME: nzbget
          TEST_NZBGET_PASSWORD: tegbzn6789
          TEST_NZBGET_NZB_URL: http://127.0.0.1:8768/fixtures/sample.nzb
        run: pnpm run test
